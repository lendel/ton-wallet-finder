name: Publish tonvanity to npm

# Publishes packages/tonvanity (the `npx tonvanity` short-name package) with npm Trusted
# Publishing, like publish.yml does for the main package. Triggered by tags
# `tonvanity-vX.Y.Z`. npm only lets you register a trusted publisher for a package that
# already exists, so the very first version is published with a temporary token
# (see the Publish step and CONTRIBUTING.md).
on:
  push:
    tags:
      - "tonvanity-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-tonvanity
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tonvanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # OIDC token for npm trusted publishing + provenance
    defaults:
      run:
        working-directory: packages/tonvanity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Check that the tag matches packages/tonvanity/package.json
        if: github.ref_type == 'tag'
        run: |
          PKG="tonvanity-v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/tonvanity version $PKG"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Only for the very first publish, before a trusted publisher can be registered:
          # a temporary granular token in the NPM_TOKEN repository secret. Once the trusted
          # publisher is set up, delete the secret; this then expands to an empty value and
          # npm authenticates through OIDC as usual.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
